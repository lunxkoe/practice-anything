spring:
  application:
    name: auth-chatting-system
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    root: info

app:
  file:
    impl: local
    public-base-url: http://localhost:8080/uploads
    max-size-bytes: 5242880
    allowed-extensions: jpg,jpeg,png,webp
    local:
      upload-dir: ./uploads
  #  file:
  #    impl: s3
  #    public-base-url: https://cdn.otboo.us
  #    max-size-bytes: 5242880
  #    allowed-extensions: jpg,jpeg,png,webp
  #    s3:
  #      bucket: otboo-image
  #      region: ap-northeast-2

  temp-password:
    expiration: 3m
    generator: random
    impl: redis

  mail:
    impl: google

  security:
    token:
      access-token-expiration: 15m
      refresh-token-expiration: 14d
      access-secret: ${ACCESS_SECRET:c2hvdWxkLWJlLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmctc2VjcmV0LWtleS1mb3ItaHMyNTY=}
      refresh-secret: ${REFRESH_SECRET:c2hvdWxkLWJlLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmctc2VjcmV0LWtleS1mb3ItaHMyNTY=}
      issuer: practice-auth
      audience: practice-client
      impl: nimbus # 필수 값은 아님. 없으면 nimbus를 Default로 사용함

    user-session:
      ttl: 14d
      max-devices: 5
      expiration-policy: absolute # 없으면 absolute 기본
      concurrent-policy: multi # 없으면 multi 기본

    refresh-cookie:
      refresh-token-expiration: 14d
      secure: false # prod는 항상 true

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/my_auth_system_db?useSSL=false&serverTimezone=Asia/Seoul
    username: user
    password: pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
#        default_batch_fetch_size: 100

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${CENTURAL_GOOGLE_EMAIL_ADDRESS:}
    password: ${CENTURAL_GOOGLE_EMAIL_AUTHENTICATION_CODE:}
    properties:
      mail:
        smtp.auth: true
        smtp.starttls.enable: true
        smtp.starttls.required: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
