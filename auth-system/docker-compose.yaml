name: auth-system-storage

services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-system-postgres
    environment:
      POSTGRES_DB: authsystem
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authsystem"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auth-system-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: auth-system-mailhog
    ports:
      - "1025:1025"   # SMTP — 애플리케이션이 여기로 메일을 보냄
      - "8025:8025"   # 웹 UI — 브라우저로 받은 메일 확인 (http://localhost:8025)
