spring:
  application:
    name: auth-system

logging:
  level:
    root: info

auth-system:
  security:
    token:
      access-token-expiration: 15m
      refresh-token-expiration: 14d
      access-secret: ${ACCESS_SECRET:}
      refresh-secret: ${REFRESH_SECRET:}
      impl: nimbus

    user-session:
      user-session-expiration: 14d
      concurrent-policy: single
      expiration-policy: absolute
      impl: redis

    refresh-cookie:
      refresh-token-expiration: 14d
      secure: false

    login-attempt:
      max-attempts: 5
      window: 10m
      impl: redis

  temp-password:
    expiration: 3m

  admin:
    email: admin@email.com
    password: admin123!
    name: '최고 관리자'

  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:8080/#/}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:8080/#/auth/login}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/authsystem
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  #        default_batch_fetch_size: 100

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${CENTURAL_GOOGLE_EMAIL_ADDRESS:}
    password: ${CENTURAL_GOOGLE_EMAIL_AUTHENTICATION_CODE:}
    properties:
      mail:
        smtp.auth: true
        smtp.starttls.enable: true
        smtp.starttls.required: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            scope:
              - openid
              - profile
              - email
          kakao:
            client-name: Kakao
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post   # 카카오는 시크릿을 POST 바디로 받음
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname                           # account_email은 요청하지 않는다

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/authsystem
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
#        default_batch_fetch_size: 100

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
