spring:
  application:
    name: auth-system

logging:
  level:
    root: info

auth-system:
  security:
    token:
      access-token-expiration: 15m
      refresh-token-expiration: 14d
      access-secret: ${ACCESS_SECRET:}
      refresh-secret: ${REFRESH_SECRET:}
      impl: nimbus

    user-session:
      user-session-expiration: 14d
      concurrent-policy: single
      expiration-policy: absolute
      impl: redis

    refresh-cookie:
      refresh-token-expiration: 14d
      secure: false

    login-attempt:
      max-attempts: 5
      window: 10m
      impl: redis

  temp-password:
    expiration: 3m

  admin:
    email: admin@email.com
    password: admin123!
    name: '최고 관리자'

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/authsystem
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  #        default_batch_fetch_size: 100

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${CENTURAL_GOOGLE_EMAIL_ADDRESS:}
    password: ${CENTURAL_GOOGLE_EMAIL_AUTHENTICATION_CODE:}
    properties:
      mail:
        smtp.auth: true
        smtp.starttls.enable: true
        smtp.starttls.required: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/authsystem
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
#        default_batch_fetch_size: 100

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
